services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: "etcd-{{ '{{' }}.Task.Slot{{ '}}' }}"
    environment:
      ETCD_NAME: "etcd-{{ '{{' }}.Task.Slot{{ '}}' }}"
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd-{{ '{{' }}.Task.Slot{{ '}}' }}:2379"
      ETCD_LISTEN_METRICS_URLS: http://0.0.0.0:2381
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd-{{ '{{' }}.Task.Slot{{ '}}' }}:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: your-unique-cluster-token
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_HEARTBEAT_INTERVAL: "500"
      ETCD_ELECTION_TIMEOUT: "5000"
      ETCD_GRPC_KEEPALIVE_TIMEOUT: "10s"
    networks:
      traefik:
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: dnsrr
      placement:
        max_replicas_per_node: 1  # Spread across nodes
        preferences:
        - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        reservations:
          cpus: '0.2'
          memory: '64M'
        limits:
          cpus: '1.0'
          memory: '1G'
  traefik:
    image: sebieee/traefik:v3.6.7-distrACME-alpine
    ports:
    - target: 80
      published: 80
    - target: 443
      published: 443
    networks:
      traefik:
    logging:
      options:
        max-size: 1G
        max-file: 3
    deploy:
      replicas: 1
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        reservations:
          cpus: '0.3'
          memory: '64M'
        limits:
          cpus: '2.0'
          memory: '512M'
      placement:
        constraints:
        - node.role == worker

networks:
  traefik:
    external: true
