[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = "{{ .PortHTTP }}"
  [entryPoints.websecure]
    address = "{{ .PortHTTPS }}"

{{range $name, $resolvers := .Acme }}

[certificatesResolvers.{{ $name }}.acme]
  email = "test@traefik.io"
  keyType = "{{ $resolvers.ACME.KeyType }}"
  caServer = "{{ $resolvers.ACME.CAServer }}"

  {{if $resolvers.ACME.HTTPChallenge }}
  [certificatesResolvers.{{ $name }}.acme.httpChallenge]
    entryPoint = "{{ $resolvers.ACME.HTTPChallenge.EntryPoint }}"
  {{end}}

  {{if $resolvers.ACME.TLSChallenge }}
  [certificatesResolvers.{{ $name }}.acme.tlsChallenge]
  {{end}}

  [certificatesResolvers.{{ $name }}.acme.etcd]
    endpoints = ["{{ $.EtcdAddress }}"]
    prefix = "traefik/acme"
    lockTimeout = "{{ $.LockTimeout }}"

{{end}}

[api]
  insecure = true

[providers.file]
  filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[http.services]
  [http.services.test.loadBalancer]
    [[http.services.test.loadBalancer.servers]]
      url = "http://127.0.0.1:9010"

[http.routers]
  [http.routers.test]
    entryPoints = ["websecure"]
    rule = "Host(`traefik.acme.wtf`)"
    service = "test"
    [http.routers.test.tls]
      certResolver = "default"

  [http.routers.test2]
    entryPoints = ["websecure"]
    rule = "Host(`traefik2.acme.wtf`)"
    service = "test"
    [http.routers.test2.tls]
      certResolver = "default"
